services:
  backend:
    build:
      context: ./deep-dish-backend
    ports:
      - "8000:8000"
    volumes:
      - ./deep-dish-backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    env_file:
      - ./deep-dish-backend/.env
    command: >
      sh -c "composer install --no-interaction --prefer-dist --quiet
      && php artisan serve --host=0.0.0.0 --port=8000"
    restart: unless-stopped

  queue:
    build:
      context: ./deep-dish-backend
    volumes:
      - ./deep-dish-backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    env_file:
      - ./deep-dish-backend/.env
    command: >
      sh -c "composer install --no-interaction --prefer-dist --quiet
      && php artisan queue:work --tries=3 --sleep=3"
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./deep-dish-frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "8080:8080"
    command: sh -c "npm install --silent && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_vendor: